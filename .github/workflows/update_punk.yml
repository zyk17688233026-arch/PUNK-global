name: Daily Punk Planet Update

on:
  schedule:
    - cron: '0 2 * * *' # 每天 UTC 02:00（北京时间上午 10:00）自动运行
  workflow_dispatch: # 允许你随时在 GitHub 网页上手动点击运行

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Last.fm Update Script
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        # 抓取全球范围内流朋文化比较发达/有代表性的十几个国家
        run: |
          python3 scripts/update_punk_data.py --countries "US,GB,JP,CA,AU,DE,BR,FR,MX,SE,IT,ES,AR,PH,ID,RU,KR,FI,NL,NZ"
        
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/punk_data.js data/punk_update_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update worldwide punk data" && git push)
